highlighter: rouge

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: 'highlight'

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

paginate: 20
paginate_path: "page:num"
layout: post
permalink: /:categories/:title
excerpt_separator: "<!--more-->"

url: https://quantekk.github.io # Required: replace this with your domain
baseurl: ""
lang: zh-CN
name: 奇怪的知识  # Required: will be displayed on every page's header
title: 奇怪的知识｜经济、科技与投资观察  # Required: site's default title
shout: # Required: **TWO** lines, will be displayed on page's header.
  - 一本正经、胡说八道
  - :-)
description: "记录经济、商业、投资、科技、生物医学与社会观察的个人知识站，也提供在线数独游戏与解题教练。" # Required
author:
  name: quantek
  email: quantek@qq.com
logo: /assets/img/me.png

disqus:
  comments: false # Global toggle on/off disqus comment
  shortname: quantekk # Required if you use disqus. Repalce with your disqus shortname here

google_analytics:
  id: "G-W98K5W1MXK" # Required if you use google analytics. Replace with your tracking id here

#collections: # Define post series here
  #生命的实验室:
  #  output: true
  #demo_series_2:
  #  output: true

defaults:
  - scope:
      path: ""
    values:
      layout: "post"
